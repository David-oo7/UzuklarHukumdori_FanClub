databases:
  - name: uzuklar-hukmdori-db
    plan: free
    databaseName: uzuklar_hukmdori
    user: uzuklar_hukmdori_user

services:
  - type: web
    name: uzuklar-hukmdori
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT myproject2.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: uzuklar-hukmdori-db
          property: connectionString
