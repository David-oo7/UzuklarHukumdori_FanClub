<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Parolni tiklash — Uzuklar Hukmdori</title>
</head>
<body style="font-family:serif;padding:40px;">
  <h1>Parolni tiklash</h1>
  <p>Email manzilingizni kiriting; agar hisob mavjud bo'lsa, parolni tiklash havolasi yuboriladi.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}<br>
    {{ form.email }}<br><br>
    <button type="submit" class="btn">Havolani yuborish</button>
  </form>
</body>
</html>
