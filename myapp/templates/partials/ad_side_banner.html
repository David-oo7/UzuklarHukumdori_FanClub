{% comment %}
Yon banner — O'rta Yer fraksiya pennant bayrog'i.
Rasm: Gondor / Rohan / Mordor uslubidagi uzun uchli bayroq.
Animatsiya: tepadan aylanib tushadi.
{% endcomment %}
{% if ad %}
<a
  href="{% if ad.url %}{% url 'ad_click' ad.id %}{% else %}javascript:void(0){% endif %}"
  {% if ad.url and ad.open_new_tab %}target="_blank" rel="noopener sponsored"{% elif ad.url %}rel="sponsored"{% endif %}
  class="ad-side-banner side-{{ side }} style-{{ ad.banner_style|default:'1' }}"
  aria-label="{{ ad.title }}"
>
  <!-- Tepada osilgan metall halqa -->
  <div class="banner-hanger" aria-hidden="true">
    <span class="bh-ring"></span>
    <span class="bh-rod"></span>
  </div>

  <!-- Asosiy pennant -->
  <div class="banner-flag">
    <div class="bf-inner">
      <img class="bf-art" src="{{ ad.image.url }}" alt="{{ ad.title }}" loading="lazy" draggable="false">
      <!-- Oltin dekorativ ramka qatlami -->
      <span class="bf-edge" aria-hidden="true"></span>
      <span class="bf-flourish bf-fl-tl" aria-hidden="true"></span>
      <span class="bf-flourish bf-fl-tr" aria-hidden="true"></span>
      <span class="bf-flourish bf-fl-bl" aria-hidden="true"></span>
      <span class="bf-flourish bf-fl-br" aria-hidden="true"></span>
      <span class="bf-tip-glow" aria-hidden="true"></span>
    </div>
    <span class="banner-label">Reklama</span>
  </div>
</a>
{% endif %}
