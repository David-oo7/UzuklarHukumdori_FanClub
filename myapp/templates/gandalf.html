<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gandalf — Uzuklar Hukmdori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* --- Elf / Rivendell palitrasi --- */
    --leaf:        #7eb89a;
    --leaf-light:  #b8e0c8;
    --leaf-soft:   #d4f0e0;
    --mint:        #a8d4bc;
    --silver:      #c5d4c8;
    --silver-dim:  #8a9e92;
    --gold:        #c9a86c;
    --gold-soft:   #e8d4a8;
    --wood:        #5c6b5a;
    --wood-dark:   #2a3329;
    --bg-deep:     #0a120e;
    --bg-panel:    #121c16;
    --bg-card:     #162019;
    --ink:         #e8f0ea;
    --ink-dim:     #9bb0a3;
    --mist:        rgba(184, 224, 200, 0.08);
    --line:        rgba(126, 184, 154, 0.28);
    --line-gold:   rgba(201, 168, 108, 0.35);
    --glow:        rgba(184, 224, 200, 0.18);
    /* Orqa fon rasmi — /media/gandalf-bg.jpg ga rasm qo'ying */
    --page-bg-image: url('/media/gandalf-bg.jpg');
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }

  body {
    position: relative;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 100px 20px 48px;
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 19px;
    line-height: 1.75;
    /* Orqa fon: gradient + rasm + fallback */
    background-color: var(--bg-deep);
    background-image:
      linear-gradient(165deg, rgba(6, 14, 10, 0.82) 0%, rgba(8, 16, 12, 0.78) 40%, rgba(5, 12, 9, 0.88) 100%),
      var(--page-bg-image);
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  h1, h2, .brand { font-family: 'Cinzel', serif; letter-spacing: 0.08em; }

  /* Uzoq daraxt siluetlari */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      repeating-linear-gradient(92deg,
        transparent 0 7%,
        rgba(18, 28, 22, 0.4) 7% 7.5%,
        transparent 7.5% 18%),
      repeating-linear-gradient(88deg,
        transparent 0 4%,
        rgba(12, 20, 16, 0.45) 4% 4.25%,
        transparent 4.25% 13%);
    opacity: 0.35;
    mask-image: linear-gradient(to top, black 8%, transparent 65%);
  }

  /* Yengil tuman */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 70% 40% at 30% 90%, rgba(126, 184, 154, 0.05) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 70% 20%, rgba(201, 168, 108, 0.03) 0%, transparent 50%);
  }

  /* Yorug‘lik zarralari */
  .firefly {
    position: fixed;
    z-index: 1;
    border-radius: 50%;
    pointer-events: none;
    width: 4px;
    height: 4px;
    background: var(--leaf-light);
    box-shadow: 0 0 12px 4px rgba(184, 224, 200, 0.5);
    opacity: 0;
    animation: drift 11s ease-in-out infinite;
  }
  .firefly:nth-child(1) { left: 7%;  top: 68%; animation-delay: 0.3s; }
  .firefly:nth-child(2) { left: 16%; top: 28%; animation-delay: 2.4s; width: 3px; height: 3px; }
  .firefly:nth-child(3) { left: 89%; top: 62%; animation-delay: 1.2s; }
  .firefly:nth-child(4) { left: 76%; top: 20%; animation-delay: 3.8s; width: 5px; height: 5px; }
  .firefly:nth-child(5) { left: 48%; top: 86%; animation-delay: 4.6s; }
  .firefly:nth-child(6) { left: 93%; top: 38%; animation-delay: 5.9s; width: 3px; height: 3px; }
  .firefly:nth-child(7) { left: 32%; top: 15%; animation-delay: 1.8s; }
  .firefly:nth-child(8) { left: 62%; top: 75%; animation-delay: 6.5s; }

  @keyframes drift {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.8); }
    15%  { opacity: 0.85; }
    45%  { transform: translate(18px, -28px) scale(1); }
    75%  { opacity: 0.5; }
    100% { opacity: 0; transform: translate(-10px, -48px) scale(0.7); }
  }

  /* --- Asosiy ramka --- */
  .forest-frame {
    position: relative;
    z-index: 2;
    max-width: 680px;
    width: 100%;
    animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Kartochka */
  .card {
    position: relative;
    background:
      linear-gradient(155deg,
        color-mix(in srgb, var(--bg-card) 88%, var(--leaf) 12%) 0%,
        var(--bg-panel) 55%,
        color-mix(in srgb, var(--bg-panel) 92%, var(--gold) 8%) 100%);
    border: 1px solid var(--line);
    border-radius: 4px 4px 28px 28px;
    box-shadow:
      0 28px 70px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(184, 224, 200, 0.06),
      inset 0 1px 0 rgba(184, 224, 200, 0.08);
    max-width: 680px;
    width: 100%;
    padding: 36px 48px 48px;
    text-align: center;
    overflow: visible;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 12%;
    right: 12%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--leaf-light), var(--gold-soft), var(--leaf-light), transparent);
    opacity: 0.5;
  }

  .card::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 8%;
    right: 8%;
    height: 40px;
    background: radial-gradient(ellipse at center, rgba(126, 184, 154, 0.2) 0%, transparent 70%);
    filter: blur(6px);
    z-index: -1;
    pointer-events: none;
  }

  /* ========== ZANJIR + MEDALON (rasmdagi uslub) ========== */
  .pendant-wrap {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 8px;
    padding-top: 8px;
  }

  /* Zanjir SVG */
  .necklace {
    width: min(320px, 85%);
    height: auto;
    margin-bottom: -6px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
  }

  /* Medalon */
  .medallion {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(circle at 50% 40%, rgba(20, 32, 26, 0.95) 0%, #0c1611 70%);
    border: 2px solid color-mix(in srgb, var(--mint) 70%, var(--gold) 30%);
    box-shadow:
      0 0 0 1px rgba(168, 212, 188, 0.15),
      0 0 28px rgba(126, 184, 154, 0.2),
      inset 0 0 24px rgba(0, 0, 0, 0.5),
      0 8px 20px rgba(0, 0, 0, 0.4);
    position: relative;
    z-index: 2;
  }

  .medallion::before {
    content: '';
    position: absolute;
    inset: 5px;
    border-radius: 50%;
    border: 1px solid rgba(168, 212, 188, 0.12);
    pointer-events: none;
  }

  .medallion svg {
    width: 48px;
    height: 48px;
  }

  h1 {
    color: var(--leaf-soft);
    font-size: 2.4rem;
    font-weight: 600;
    margin: 18px 0 6px;
    letter-spacing: 0.14em;
    text-shadow: 0 0 32px rgba(184, 224, 200, 0.18);
  }

  .tagline {
    color: var(--ink-dim);
    font-style: italic;
    font-size: 1.08rem;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }

  .symbol {
    display: inline-block;
    font-family: 'Cinzel', serif;
    font-size: 0.66rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-soft);
    border: 1px solid var(--line-gold);
    background: linear-gradient(135deg, rgba(201, 168, 108, 0.1), rgba(126, 184, 154, 0.07));
    padding: 7px 20px;
    margin-bottom: 30px;
    border-radius: 2px;
  }

  /* --- CHAT --- */
  .gandalf-box {
    background: rgba(8, 14, 11, 0.5);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    text-align: left;
    display: flex;
    flex-direction: column;
    margin-bottom: 28px;
    box-shadow: inset 0 1px 0 rgba(184, 224, 200, 0.05);
  }

  .gandalf-messages {
    height: 340px;
    overflow-y: auto;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scrollbar-width: thin;
    scrollbar-color: var(--leaf) transparent;
  }
  .gandalf-messages::-webkit-scrollbar { width: 6px; }
  .gandalf-messages::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--leaf) 55%, transparent);
    border-radius: 6px;
  }

  .gandalf-msg {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    animation: msgIn 0.35s ease-out both;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .gandalf-msg.user-msg { flex-direction: row-reverse; }

  .gandalf-avatar {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--leaf);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    background: color-mix(in srgb, var(--leaf) 12%, transparent);
  }
  .gandalf-msg.user-msg .gandalf-avatar {
    border-color: var(--gold);
    background: color-mix(in srgb, var(--gold) 18%, transparent);
  }

  .gandalf-bubble {
    background: linear-gradient(145deg, rgba(126, 184, 154, 0.1), rgba(0, 0, 0, 0.28));
    border: 1px solid var(--line);
    border-left: 3px solid var(--leaf);
    border-radius: 3px 16px 16px 16px;
    padding: 11px 15px;
    color: var(--ink);
    font-size: 0.97rem;
    line-height: 1.55;
    max-width: 78%;
  }
  .gandalf-msg.user-msg .gandalf-bubble {
    background: linear-gradient(145deg, rgba(201, 168, 108, 0.14), rgba(0, 0, 0, 0.28));
    border-color: var(--line-gold);
    border-left: 3px solid var(--gold);
    border-radius: 16px 3px 16px 16px;
  }
  .gandalf-msg.gandalf-error .gandalf-bubble {
    color: #e8a090;
    border-color: rgba(232, 160, 144, 0.45);
    border-left-color: #e8a090;
  }
  .gandalf-typing {
    color: var(--ink-dim);
    font-style: italic;
  }

  .gandalf-form {
    display: flex;
    gap: 10px;
    padding: 16px 18px;
    border-top: 1px solid var(--line);
    align-items: flex-end;
    background: rgba(0, 0, 0, 0.2);
  }
  .gandalf-form textarea {
    flex: 1;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    padding: 11px 14px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 1.02rem;
    resize: none;
    max-height: 140px;
    min-height: 44px;
    line-height: 1.45;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .gandalf-form textarea:focus {
    outline: none;
    border-color: var(--leaf);
    box-shadow: 0 0 0 3px rgba(126, 184, 154, 0.18);
  }
  .gandalf-form textarea::placeholder { color: var(--ink-dim); }

  .gandalf-form button {
    border: 1px solid color-mix(in srgb, var(--leaf) 60%, var(--gold) 40%);
    background: linear-gradient(160deg,
      color-mix(in srgb, var(--leaf) 35%, transparent),
      color-mix(in srgb, var(--wood-dark) 55%, transparent));
    color: var(--ink);
    border-radius: 8px;
    padding: 11px 22px;
    font-family: 'Cinzel', serif;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.22s ease;
    flex-shrink: 0;
  }
  .gandalf-form button:hover {
    background: linear-gradient(160deg, var(--leaf), color-mix(in srgb, var(--leaf) 70%, var(--gold) 30%));
    border-color: var(--leaf-light);
    color: #0a120e;
    box-shadow: 0 0 20px rgba(126, 184, 154, 0.4);
  }
  .gandalf-form button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .actions {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink-dim);
    padding: 12px 24px;
    font-family: 'Cinzel', serif;
    font-size: 0.76rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.22s ease;
    display: inline-block;
    border-radius: 6px;
  }
  .btn:hover {
    background: color-mix(in srgb, var(--leaf) 15%, transparent);
    border-color: var(--leaf);
    color: var(--leaf-soft);
  }
  .btn.ghost {
    background: transparent;
    color: var(--ink-dim);
    border-color: var(--line);
  }
  .btn.ghost:hover {
    color: var(--ink);
    border-color: var(--leaf);
  }

  @media (max-width: 540px) {
    body { padding: 72px 12px 28px; }
    .card { padding: 28px 18px 28px; }
    .medallion { width: 92px; height: 92px; }
    .medallion svg { width: 40px; height: 40px; }
    .necklace { width: min(260px, 90%); }
    .gandalf-messages { height: 260px; padding: 14px; }
    .gandalf-form { padding: 12px; flex-wrap: wrap; }
    .gandalf-form textarea { min-width: 100%; flex: none; }
    .gandalf-form button { flex: 1; }
    h1 { font-size: 1.85rem; letter-spacing: 0.1em; }
  }

{% include "theme_variables.html" %}
</style>
</head>
<body class="{% if user_race %}theme-{{ user_race }}{% endif %} {% if user_faction %}theme-faction-{{ user_faction }}{% endif %}">

  <span class="firefly"></span>
  <span class="firefly"></span>
  <span class="firefly"></span>
  <span class="firefly"></span>
  <span class="firefly"></span>
  <span class="firefly"></span>
  <span class="firefly"></span>
  <span class="firefly"></span>

  <div class="forest-frame">
    <div class="card">

      <!-- Zanjir + Medalon (rasmdagi uslub) -->
      <div class="pendant-wrap">
        <svg class="necklace" viewBox="0 0 320 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Zanjir bo'g'inlari — chap -->
          <g fill="none" stroke="var(--mint)" stroke-width="2.2" stroke-linecap="round" opacity="0.85">
            <ellipse cx="28"  cy="14" rx="11" ry="7"/>
            <ellipse cx="52"  cy="14" rx="11" ry="7"/>
            <ellipse cx="76"  cy="14" rx="11" ry="7"/>
            <ellipse cx="100" cy="14" rx="11" ry="7"/>
            <ellipse cx="124" cy="14" rx="11" ry="7"/>
            <!-- O'ng -->
            <ellipse cx="196" cy="14" rx="11" ry="7"/>
            <ellipse cx="220" cy="14" rx="11" ry="7"/>
            <ellipse cx="244" cy="14" rx="11" ry="7"/>
            <ellipse cx="268" cy="14" rx="11" ry="7"/>
            <ellipse cx="292" cy="14" rx="11" ry="7"/>
          </g>
          <!-- Yengil ichki yorug'lik -->
          <g fill="none" stroke="var(--leaf-soft)" stroke-width="1" opacity="0.35">
            <ellipse cx="28"  cy="14" rx="7" ry="4"/>
            <ellipse cx="52"  cy="14" rx="7" ry="4"/>
            <ellipse cx="76"  cy="14" rx="7" ry="4"/>
            <ellipse cx="100" cy="14" rx="7" ry="4"/>
            <ellipse cx="124" cy="14" rx="7" ry="4"/>
            <ellipse cx="196" cy="14" rx="7" ry="4"/>
            <ellipse cx="220" cy="14" rx="7" ry="4"/>
            <ellipse cx="244" cy="14" rx="7" ry="4"/>
            <ellipse cx="268" cy="14" rx="7" ry="4"/>
            <ellipse cx="292" cy="14" rx="7" ry="4"/>
          </g>
          <!-- Pastga tushuvchi ip -->
          <path d="M124,18 Q140,28 148,42" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <path d="M196,18 Q180,28 172,42" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
          <!-- Markaziy ilgak -->
          <ellipse cx="160" cy="48" rx="9" ry="6" fill="none" stroke="var(--mint)" stroke-width="2" opacity="0.85"/>
          <path d="M160,54 L160,62" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
        </svg>

        <div class="medallion">
          <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <!-- Tayoq -->
            <line x1="24" y1="42" x2="24" y2="14" stroke="var(--mint)" stroke-width="2.4" stroke-linecap="round"/>
            <!-- Barglar -->
            <path d="M24,14 C16,14 11,9 12.5,3 C18.5,5.5 24,9 24,14 Z" fill="var(--leaf)"/>
            <path d="M24,14 C32,14 37,9 35.5,3 C29.5,5.5 24,9 24,14 Z" fill="var(--leaf-light)"/>
            <!-- Markaziy nuqta -->
            <circle cx="24" cy="12" r="2.8" fill="var(--leaf-soft)"/>
            <!-- Yengil nur -->
            <circle cx="24" cy="12" r="7" fill="none" stroke="var(--mint)" stroke-width="0.7" opacity="0.35"/>
          </svg>
        </div>
      </div>

      <h1>GANDALF</h1>
      <p class="tagline">Kulrang sayohatchi — donishmand yordamchingiz</p>
      <span class="symbol">Ramz — Istari</span>

      <div class="gandalf-box">
        <div class="gandalf-messages" id="gandalf-messages">
          <div class="gandalf-msg">
            <span class="gandalf-avatar">🍃</span>
            <div class="gandalf-bubble">Salom, sayohatchi! Men Gandalfman. Menga xohlagan savolingizni bering.</div>
          </div>
        </div>
        <form class="gandalf-form" id="gandalf-form">
          {% csrf_token %}
          <textarea id="gandalf-input" rows="1" placeholder="Savolingizni yozing, uzun matnni tashlab xulosalashni so'rang yoki Sindarin/Quenyaga tarjima so'rang..." maxlength="4000"></textarea>
          <button type="submit" id="gandalf-submit">So'rash</button>
        </form>
      </div>

      <div class="actions">
        <a href="{% url 'home' %}" class="btn ghost">← Bosh sahifaga qaytish</a>
      </div>
    </div>
  </div>

<script>
(function(){
  const form = document.getElementById('gandalf-form');
  const input = document.getElementById('gandalf-input');
  const submitBtn = document.getElementById('gandalf-submit');
  const messagesBox = document.getElementById('gandalf-messages');

  function getCookie(name){
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
  }

  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      form.requestSubmit();
    }
  });

  function addMessage(text, opts){
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'gandalf-msg' + (opts.isUser ? ' user-msg' : '') + (opts.isError ? ' gandalf-error' : '');
    div.innerHTML = '<span class="gandalf-avatar">' + (opts.isUser ? '🙂' : '🍃') + '</span><div class="gandalf-bubble"></div>';
    div.querySelector('.gandalf-bubble').textContent = text;
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
    return div;
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, { isUser: true });
    input.value = '';
    input.style.height = 'auto';
    submitBtn.disabled = true;

    const typingMsg = addMessage("Gandalf o'ylanmoqda...", {});
    typingMsg.querySelector('.gandalf-bubble').classList.add('gandalf-typing');

    fetch('{% url "ask_gandalf" %}', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ question: question }),
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      typingMsg.remove();
      if (data.answer) {
        addMessage(data.answer, {});
      } else {
        addMessage(data.error || "Nimadir xato ketdi.", { isError: true });
      }
    })
    .catch(function(){
      typingMsg.remove();
      addMessage("Aloqa xatoligi yuz berdi. Qayta urinib ko'ring.", { isError: true });
    })
    .finally(function(){
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
