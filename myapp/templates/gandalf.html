<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gandalf — Uzuklar Hukmdori</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#c9a34e;
    --bg-dark:#0b0d0a; --bg-panel:#12160f;
    --ink:#e6e0cf; --ink-dim:#a89f8a; --line: rgba(201,163,78,.35);
    /* Orqa fon rasmi: media/gandalf-bg.jpg fayliga rasm joylashtirsangiz avtomatik ko'rinadi */
    --page-bg-image: url('/media/gandalf-bg.jpg');
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:
      linear-gradient(rgba(8,10,6,.86), rgba(8,10,6,.86)),
      var(--page-bg-image, none),
      radial-gradient(ellipse at top, color-mix(in srgb, var(--accent) 18%, #14170f) 0%, var(--bg-dark) 65%);
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:var(--ink); font-family:'Cormorant Garamond', serif; font-size:19px; line-height:1.7;
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px;
  }
  h1,h2,.brand{ font-family:'Cinzel', serif; letter-spacing:.04em; }

  .card{
    background:rgba(15,18,12,.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
    max-width:640px; width:100%; padding:48px 44px; text-align:center;
  }
  .icon{
    font-size:3.2rem; width:96px; height:96px; margin:0 auto 20px;
    display:flex; align-items:center; justify-content:center; border-radius:50%;
    border:2px solid var(--accent); box-shadow:0 0 30px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  h1{ color:var(--accent); font-size:2.2rem; margin-bottom:6px; }
  .tagline{ color:var(--ink-dim); font-style:italic; font-size:1.05rem; margin-bottom:30px; }
  .symbol{
    display:inline-block; font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent); padding:6px 16px; margin-bottom:30px;
  }

  /* CHAT WIDGET */
  .gandalf-box{
    background:rgba(0,0,0,.22); border:1px solid var(--line);
    text-align:left; display:flex; flex-direction:column; margin-bottom:24px;
  }
  .gandalf-messages{
    height:320px; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px;
  }
  .gandalf-msg{ display:flex; gap:12px; align-items:flex-start; }
  .gandalf-msg.user-msg{ flex-direction:row-reverse; }
  .gandalf-avatar{
    flex-shrink:0; width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--accent); display:flex; align-items:center; justify-content:center;
    font-size:.95rem; color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, transparent);
  }
  .gandalf-bubble{
    background:rgba(0,0,0,.35); border:1px solid var(--line); padding:9px 13px;
    color:var(--ink); font-size:.95rem; line-height:1.5; max-width:78%;
  }
  .gandalf-msg.user-msg .gandalf-bubble{
    background:color-mix(in srgb, var(--accent) 18%, transparent); border-color:var(--accent);
  }
  .gandalf-msg.gandalf-error .gandalf-bubble{ color:#d8817b; border-color:#d8817b; }
  .gandalf-typing{ color:var(--ink-dim); font-style:italic; }
  .gandalf-form{
    display:flex; gap:8px; padding:14px 16px; border-top:1px solid var(--line); align-items:flex-end;
  }
  .gandalf-form textarea{
    flex:1; background:rgba(0,0,0,.35); border:1px solid var(--line); color:var(--ink);
    padding:9px 12px; font-family:'Cormorant Garamond',serif; font-size:1rem;
    resize:none; max-height:140px; min-height:40px; line-height:1.4;
  }
  .gandalf-form textarea::placeholder{ color:var(--ink-dim); }
  .gandalf-form button{
    border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--ink);
    padding:9px 20px; font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.12em; text-transform:uppercase;
    cursor:pointer; transition:.2s; flex-shrink:0;
  }
  .gandalf-form button:hover{ background:var(--accent); color:#141810; }
  .gandalf-form button:disabled{ opacity:.5; cursor:not-allowed; }

  .actions{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .btn{
    border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--ink);
    padding:12px 22px; font-family:'Cinzel',serif; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase;
    text-decoration:none; transition:.2s; display:inline-block;
  }
  .btn:hover{ background:var(--accent); color:#141810; }
  .btn.ghost{ background:transparent; color:var(--ink-dim); border-color:var(--line); }
  .btn.ghost:hover{ color:var(--ink); border-color:var(--accent); }

  @media (max-width: 520px) {
    body { padding: 20px 10px; }
    .card { padding: 24px 16px; }
    .gandalf-messages { height: 250px; padding: 12px; }
    .gandalf-form { padding: 10px; flex-wrap: wrap; }
    .gandalf-form textarea { min-width: 100%; flex: none; }
    .gandalf-form button { flex: 1; }
  }
{% include "theme_variables.html" %}
</style>
</head>
<body class="{% if user_race %}theme-{{ user_race }}{% endif %} {% if user_faction %}theme-faction-{{ user_faction }}{% endif %}">
  <div class="card">
    <div class="icon">✦</div>
    <h1>Gandalf</h1>
    <p class="tagline">Kulrang sayohatchi — donishmand yordamchingiz</p>
    <span class="symbol">Ramz — Istari</span>

    <div class="gandalf-box">
      <div class="gandalf-messages" id="gandalf-messages">
        <div class="gandalf-msg">
          <span class="gandalf-avatar">✦</span>
          <div class="gandalf-bubble">Salom, sayohatchi! Men Gandalfman. Menga xohlagan savolingizni bering.</div>
        </div>
      </div>
      <form class="gandalf-form" id="gandalf-form">
        {% csrf_token %}
        <textarea id="gandalf-input" rows="1" placeholder="Savolingizni yozing, uzun matnni tashlab xulosalashni so'rang yoki Sindarin/Quenyaga tarjima soring..." maxlength="4000"></textarea>
        <button type="submit" id="gandalf-submit">So'rash</button>
      </form>
    </div>

    <div class="actions">
      <a href="{% url 'home' %}" class="btn ghost">← Bosh sahifaga qaytish</a>
    </div>
  </div>

<script>
(function(){
  const form = document.getElementById('gandalf-form');
  const input = document.getElementById('gandalf-input');
  const submitBtn = document.getElementById('gandalf-submit');
  const messagesBox = document.getElementById('gandalf-messages');

  function getCookie(name){
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? match.pop() : '';
  }

  // Matn ko'payishi bilan textarea avtomatik balandlashadi (140px gacha)
  input.addEventListener('input', function(){
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 140) + 'px';
  });

  // Enter — yuborish, Shift+Enter — yangi qator
  input.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.shiftKey) {
      ev.preventDefault();
      form.requestSubmit();
    }
  });

  function addMessage(text, opts){
    opts = opts || {};
    const div = document.createElement('div');
    div.className = 'gandalf-msg' + (opts.isUser ? ' user-msg' : '') + (opts.isError ? ' gandalf-error' : '');
    div.innerHTML = '<span class="gandalf-avatar">' + (opts.isUser ? '🙂' : '✦') + '</span><div class="gandalf-bubble"></div>';
    div.querySelector('.gandalf-bubble').textContent = text;
    messagesBox.appendChild(div);
    messagesBox.scrollTop = messagesBox.scrollHeight;
    return div;
  }

  form.addEventListener('submit', function(ev){
    ev.preventDefault();
    const question = input.value.trim();
    if (!question) return;

    addMessage(question, { isUser: true });
    input.value = '';
    input.style.height = 'auto';
    submitBtn.disabled = true;

    const typingMsg = addMessage('Gandalf o\'ylanmoqda...', {});
    typingMsg.querySelector('.gandalf-bubble').classList.add('gandalf-typing');

    fetch('{% url "ask_gandalf" %}', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken'),
      },
      body: JSON.stringify({ question: question }),
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      typingMsg.remove();
      if (data.answer) {
        addMessage(data.answer, {});
      } else {
        addMessage(data.error || "Nimadir xato ketdi.", { isError: true });
      }
    })
    .catch(function(){
      typingMsg.remove();
      addMessage("Aloqa xatoligi yuz berdi. Qayta urinib ko'ring.", { isError: true });
    })
    .finally(function(){
      submitBtn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
